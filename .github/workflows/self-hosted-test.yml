name: Self-Hosted Windows Runner Test

on:
  push:
    branches: [ main ]  # Adjust if your branch is not 'main'

jobs:
  test-runner:
    runs-on: [self-hosted, my-laptop]
    steps:
      - name: Say Hello
        run: echo "✅ Hello from the self-hosted Windows runner!"

      - name: Print system info
        run: systeminfo

      - name: List directory contents
        run: dir
